name: Integration
on:
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # Honors the packageManager field
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - name: Install Dependencies
        run: pnpm install
      - name: Lint Codebase
        run: pnpm run --if-present lint:github
      - name: Check formatting
        run: pnpm run fmt:check
      - name: Type Tests
        run: pnpm run test:types
      - name: Unit Test
        run: npx vitest --reporter=junit --outputFile=test-report.junit.xml
      - name: Coverage
        run: pnpm run test:cov
      - name: Benchmark Tests
        run: pnpm run bench
      - name: Run Build
        run: pnpm run build
